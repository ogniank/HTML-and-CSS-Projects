<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Lists</title>
        <link rel="stylesheet" type="text/css" href="CSS_Lists.css">
    </head>
    <body>
        <h1>My Lists</h1>

        <h3>Favorite Fruits (unordered list)</h3>
        <ul>
            <li>Apples</li>
            <li>Bananas</li>
            <li>Grapes</li>
            <li>Mangoes</li>
        </ul>

        <h3>Morning Routine (ordered list)</h3>
        <ol>
            <li>Wake up</li>
            <li>Brush teeth</li>
            <li>Eat breakfast</li>
            <li>Go to school</li>
        </ol>
    </body>
</html>
