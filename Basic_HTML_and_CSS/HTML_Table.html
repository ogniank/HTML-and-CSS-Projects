<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dog Breeds Table</title>
        <link rel="stylesheet" type="text/css" href="CSS_Table.css">
    </head>
    <body>
        <h1>Dog Breeds table</h1>
        <table style="width:100%">
            <tr>
                <th>Breed</th>
                <th>Size</th>
                <th>Energy Level</th>
                <th>Notes</th>
            </tr>
            <tr>
                <td>Golden Retriever</td>
                <td>Large</td>
                <td>High</td>
                <td>Friendly and great with families.</td>
            </tr>
            <tr>
                <td>Bulldog</td>
                <td>Medium</td>
                <td>Low</td>
                <td>Calm and loves naps.</td>
            </tr>
            <tr>
                <td>Chihuahua</td>
                <td>Small</td>
                <td>Medium</td>
                <td>Tiny but brave.</td>
            </tr>
        </table>
    </body>
</html>
